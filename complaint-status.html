```html
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Complaint Status</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="nav">

    <div class="logo">CampusVoice</div>

    <nav>
        <a href="index.html">Home</a>
    </nav>

</header>


<main class="container">

    <div class="card">

        <h2>Check Complaint Status</h2>

        <div class="search-box">

            <input
                type="text"
                id="searchId"
                placeholder="Enter Complaint ID"
            >

            <button class="btn" onclick="checkStatus()">
                Check Status
            </button>

        </div>


        <div id="statusResult" class="status-card hidden">

            <p>
                <strong>Complaint ID:</strong>
                <span id="resultId"></span>
            </p>

            <p>
                <strong>Status:</strong>
                <span id="resultStatus" class="badge"></span>
            </p>

            <p>
                <strong>Name:</strong>
                <span id="resultName"></span>
            </p>

            <p>
                <strong>Department:</strong>
                <span id="resultDepartment"></span>
            </p>

            <p>
                <strong>Category:</strong>
                <span id="resultCategory"></span>
            </p>

            <p>
                <strong>Description:</strong>
                <span id="resultDescription"></span>
            </p>

            <p>
                <strong>Created Date:</strong>
                <span id="resultDate"></span>
            </p>

        </div>

    </div>

</main>


<script>

const API_URL =
    "https://87frpah2gl.execute-api.ap-south-1.amazonaws.com/prod/complaints";


async function checkStatus() {

    const id =
        document.getElementById("searchId")
        .value
        .trim();


    if (id === "") {

        alert("Please enter a Complaint ID.");

        return;
    }


    try {

        const response = await fetch(
            `${API_URL}/${encodeURIComponent(id)}`
        );


        if (response.status === 404) {

            alert("Complaint not found.");

            return;
        }


        if (!response.ok) {

            throw new Error(
                "Unable to fetch complaint."
            );
        }


        const complaint =
            await response.json();


        document.getElementById("resultId")
            .textContent =
            complaint.ComplaintID || "";


        document.getElementById("resultName")
            .textContent =
            complaint.Name || "";


        document.getElementById("resultDepartment")
            .textContent =
            complaint.Department || "";


        document.getElementById("resultCategory")
            .textContent =
            complaint.Category || "";


        document.getElementById("resultDescription")
            .textContent =
            complaint.Description || "";


        document.getElementById("resultDate")
            .textContent =
            complaint.CreatedDate || "";


        const badge =
            document.getElementById("resultStatus");


        badge.textContent =
            complaint.Status || "";


        badge.className = "badge";


        if (complaint.Status === "Pending") {

            badge.classList.add("pending");

        }

        else if (complaint.Status === "In Progress") {

            badge.classList.add("progress");

        }

        else if (complaint.Status === "Resolved") {

            badge.classList.add("resolved");

        }


        document.getElementById("statusResult")
            .classList.remove("hidden");

    }


    catch (error) {

        console.error(error);

        alert(
            "Something went wrong while fetching complaint details."
        );

    }

}

</script>

</body>

</html>
```
